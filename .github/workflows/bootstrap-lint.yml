# One-off: installs the lint and format toolchain, reformats the code, applies the
# safe lint auto-fixes and commits a lint report on this branch. Deleted afterwards.
name: Bootstrap lint and format

on:
  push:
    branches: [chore/lint-format]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/lint-format

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Identity
        run: |
          git config user.name "Renato Batista"
          git config user.email "109666299+RBatista24@users.noreply.github.com"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format and auto-fix
        run: |
          pnpm format
          pnpm lint:fix || true
          pnpm format
          git add -A
          git diff --cached --quiet || git commit -m "style: format and apply ESLint auto-fixes"

      - name: Record existing debt as ESLint bulk suppressions
        run: |
          pnpm exec eslint . --suppress-rule sonarjs/cognitive-complexity --suppress-rule sonarjs/no-nested-conditional --suppress-rule sonarjs/redundant-type-aliases || true
          git add -A
          git diff --cached --quiet || git commit -m "chore: record existing complexity and nested-ternary findings as ESLint suppressions"

      - name: Report
        run: |
          {
            echo "== format"; pnpm -s format:check 2>&1 | tail -5 || true
            echo "== lint"; pnpm -s lint 2>&1 || true
            echo "== typecheck"; pnpm -s typecheck 2>&1 || true
            echo "== test"; pnpm -s test 2>&1 | tail -12 || true
          } > lint-report.txt
          git add lint-report.txt
          git commit -m "chore: lint report from the bootstrap run"

      - name: Push
        run: git push origin HEAD:chore/lint-format
